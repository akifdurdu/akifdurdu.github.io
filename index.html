<style>
:root{
  --bg:#F3F5F3; --panel:#E8EDEA; --ink:#16202A; --mute:#55616D; --line:#D2D9D5;
  --acc:#0B6A8E; --obs:rgba(22,32,42,.08); --edge:rgba(22,32,42,.30);
  --serif:'Newsreader',Georgia,'Times New Roman',serif;
  --sans:'Hanken Grotesk',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0F171D;--panel:#16212A;--ink:#E5EBEE;--mute:#93A2AE;--line:#25323C;--acc:#62C3E3;--obs:rgba(229,235,238,.07);--edge:rgba(229,235,238,.26);color-scheme:dark}
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--serif);font-size:1.0625rem;line-height:1.65;-webkit-font-smoothing:antialiased}
html[lang="tr"] [data-l="en"],html[lang="en"] [data-l="tr"]{display:none}
a{color:var(--acc);text-underline-offset:3px;text-decoration-thickness:1px}
a:hover{text-decoration-thickness:2px}
:focus-visible{outline:2px solid var(--acc);outline-offset:3px;border-radius:2px}
b,strong{font-weight:600}
p{margin:0 0 1em}

.shell{max-width:1200px;margin:0 auto;padding:0 32px;display:grid;grid-template-columns:240px minmax(0,1fr);column-gap:72px}
.side{position:sticky;top:0;height:100vh;padding:44px 0 32px;display:flex;flex-direction:column;gap:30px;overflow-y:auto;font-family:var(--sans);font-size:.92rem}
.brand{font-family:var(--serif);font-size:1.35rem;font-weight:500;line-height:1.2;color:var(--ink);text-decoration:none;letter-spacing:-.005em}
.brand small{display:block;font-family:var(--sans);font-size:.8rem;font-weight:400;color:var(--mute);margin-top:4px;letter-spacing:0}
.lang{display:flex;gap:0;border:1px solid var(--line);border-radius:6px;width:max-content;overflow:hidden}
.lang button{font:inherit;font-size:.85rem;background:none;border:0;color:var(--mute);padding:5px 12px;cursor:pointer}
.lang button+button{border-left:1px solid var(--line)}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.nav ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.nav a{display:block;padding:5px 0 5px 14px;color:var(--mute);text-decoration:none;border-left:2px solid var(--line)}
.nav a:hover{color:var(--ink)}
.nav a.on{color:var(--ink);border-left-color:var(--acc);font-weight:500}
.profiles{margin-top:auto;display:flex;flex-direction:column;gap:6px}
.profiles a{color:var(--mute);text-decoration:none;display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding-bottom:6px}
.profiles a:hover{color:var(--acc)}
.profiles span:last-child{font-variant-numeric:tabular-nums}

main{padding:64px 0 120px;max-width:800px}
.hero{display:flex;gap:36px;align-items:flex-start;justify-content:space-between}
.hero h1{font-weight:500;font-size:clamp(2.9rem,7.2vw,5rem);line-height:1;letter-spacing:-.025em;margin:0 0 20px}
.hero .role{font-size:1.3rem;line-height:1.4;margin:0 0 18px;max-width:30ch}
.hero .lede{color:var(--mute);max-width:56ch}
.portrait{width:150px;height:190px;object-fit:cover;border-radius:4px;flex:none;background:var(--panel)}
.field{margin:40px 0 0}
.field canvas{display:block;width:100%;aspect-ratio:16/7.5;background:var(--panel);border:1px solid var(--line);border-radius:4px;cursor:crosshair}
.field figcaption{display:flex;gap:16px;justify-content:space-between;align-items:flex-start;font-family:var(--sans);font-size:.84rem;line-height:1.5;color:var(--mute);margin-top:10px}
.field button{font:inherit;font-size:.84rem;flex:none;background:none;border:1px solid var(--line);color:var(--ink);border-radius:6px;padding:4px 10px;cursor:pointer}
.field button:hover{border-color:var(--acc);color:var(--acc)}

section{padding-top:72px;scroll-margin-top:0}
h2{font-weight:500;font-size:2rem;letter-spacing:-.015em;line-height:1.15;margin:0 0 22px}
h3{font-family:var(--sans);font-weight:600;font-size:.98rem;margin:40px 0 4px;color:var(--ink)}
.row{display:grid;grid-template-columns:138px minmax(0,1fr);gap:2px 28px;padding:14px 0;border-top:1px solid var(--line)}
.row:last-child{border-bottom:1px solid var(--line)}
.when{font-family:var(--sans);font-size:.88rem;color:var(--mute);font-variant-numeric:tabular-nums;padding-top:3px}
.what .t{font-size:1.06rem;line-height:1.4}
.what .m{font-family:var(--sans);font-size:.88rem;color:var(--mute);margin-top:3px;line-height:1.5}
.what .m a{color:inherit}
dl.groups{margin:0}
dl.groups div{padding:14px 0;border-top:1px solid var(--line);display:grid;grid-template-columns:138px minmax(0,1fr);gap:2px 28px}
dl.groups div:last-child{border-bottom:1px solid var(--line)}
dl.groups dt{font-family:var(--sans);font-size:.88rem;color:var(--mute);padding-top:3px}
dl.groups dd{margin:0}
.idx{font-family:var(--sans);font-size:.92rem;color:var(--mute);margin-top:22px}
.idx a{color:var(--ink)}

.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:6px 0 14px;font-family:var(--sans);font-size:.86rem;color:var(--mute)}
.chip{font:inherit;background:none;border:1px solid var(--line);color:var(--ink);border-radius:6px;padding:3px 11px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pub{margin:0}
.pub .au{color:var(--mute)}
.pub .au b{color:var(--ink)}
.pub .ti{display:block;font-size:1.04rem;line-height:1.4;margin:1px 0}
.pub .vn{font-family:var(--sans);font-size:.86rem;color:var(--mute);line-height:1.5}
.q{display:inline-block;font-family:var(--sans);font-size:.74rem;line-height:1.5;border:1px solid var(--line);border-radius:4px;padding:0 6px;margin-left:6px;color:var(--mute);white-space:nowrap}
.q.q1{color:var(--acc);border-color:var(--acc)}
details{margin-top:6px}
summary{cursor:pointer;font-family:var(--sans);font-size:.9rem;color:var(--acc);padding:10px 0}
.note{font-family:var(--sans);font-size:.88rem;color:var(--mute)}

@media (max-width:920px){
  .shell{display:block;padding:0 20px}
  .side{height:auto;padding:12px 0 0;gap:10px;flex-direction:row;flex-wrap:wrap;align-items:center;background:var(--bg);z-index:10;border-bottom:1px solid var(--line)}
  .brand{flex:1;font-size:1.15rem}.brand small{display:none}
  .nav{flex-basis:100%;overflow-x:auto;order:3;margin:0 -20px;padding:0 20px;scrollbar-width:none}
  .nav::-webkit-scrollbar{display:none}
  .nav ul{flex-direction:row;gap:18px}
  .nav a{border-left:0;border-bottom:2px solid transparent;padding:6px 0 8px;white-space:nowrap}
  .nav a.on{border-bottom-color:var(--acc)}
  .profiles{display:none}
  main{padding-top:40px}
  section{scroll-margin-top:84px;padding-top:56px}
  .hero{flex-direction:column-reverse;gap:24px}
  .portrait{width:110px;height:140px}
}
@media (max-width:620px){
  .row,dl.groups div{grid-template-columns:1fr;gap:0}
  .when{padding-top:0;margin-bottom:2px}
  .field canvas{aspect-ratio:4/3}
  h2{font-size:1.7rem}
}
</style>
</head>

<script>
/* ---------- helpers ---------- */
const b=(en,tr)=>`<span data-l="en">${en}</span><span data-l="tr">${tr}</span>`;
const $=id=>document.getElementById(id);
const MON={en:['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'],tr:['Oca','Şub','Mar','Nis','May','Haz','Tem','Ağu','Eyl','Eki','Kas','Ara']};
const dt=(s,l)=>{const [y,m]=s.split('-');return `${MON[l][+m-1]} ${y}`};
const PRESENT=['present','günümüz'], ONGOING=['ongoing','devam ediyor'];
const row=(when,t,m)=>`<div class="row"><div class="when">${when}</div><div class="what"><div class="t">${t}</div>${m?`<div class="m">${m}</div>`:''}</div></div>`;

document.querySelectorAll('[data-en]').forEach(el=>{el.innerHTML=b(el.dataset.en,el.dataset.tr);});

/* ---------- navigation & profile links ---------- */
const NAV=[['research','Research','Araştırma'],['news','News','Haberler'],['career','Career','Kariyer'],['projects','Projects','Projeler'],['publications','Publications','Yayınlar'],['teaching','Teaching','Ders ve danışmanlık'],['honors','Honors','Ödüller'],['contact','Contact','İletişim']];
$('nav').innerHTML=NAV.map(n=>`<li><a href="#${n[0]}">${b(n[1],n[2])}</a></li>`).join('');
const PROF=[
 ['Google Scholar','https://scholar.google.com/citations?user=4wHq7iwAAAAJ&hl=tr&oi=ao','25'],
 ['ResearchGate','https://www.researchgate.net/profile/Akif-DURDU','24'],
 ['Scopus','https://www.scopus.com/authid/detail.uri?authorId=55364612200','20'],
 ['Web of Science','https://www.webofscience.com/wos/author/record/AAQ-4344-2020','18'],
 ['ORCID','https://orcid.org/0000-0002-5611-2322',''],
 ['RAC-LAB','https://raclab.org','']
];
$('profiles').innerHTML=PROF.map(p=>`<a href="${p[1]}" target="_blank" rel="noopener"><span>${p[0]}</span><span>${p[2]?'h '+p[2]:'↗'}</span></a>`).join('');
$('indices').innerHTML=b(
 'h-index: Google Scholar 25, ResearchGate 24, Scopus 20, Web of Science 18. Scopus Author ID 55364612200; Web of Science ResearcherID AAQ-4344-2020; <a href="https://orcid.org/0000-0002-5611-2322" target="_blank" rel="noopener">ORCID 0000-0002-5611-2322</a>.',
 'h-indeks: Google Scholar 25, ResearchGate 24, Scopus 20, Web of Science 18. Scopus Yazar No: 55364612200; Web of Science ResearcherID: AAQ-4344-2020; <a href="https://orcid.org/0000-0002-5611-2322" target="_blank" rel="noopener">ORCID 0000-0002-5611-2322</a>.');

/* ---------- research ---------- */
const INT=[
 ['Autonomous systems','Otonom sistemler','UAVs, unmanned ground vehicles and underwater vehicles; path and motion planning; localization and navigation without GPS; SLAM and visual SLAM; sensor fusion and extended Kalman filtering; swarm systems; ROS; mobile and cognitive robotics.','İHA’lar, insansız kara araçları ve sualtı araçları; yol ve hareket planlama; GPS’siz konumlama ve seyrüsefer; SLAM ve görsel SLAM; sensör füzyonu ve genişletilmiş Kalman filtresi; sürü sistemleri; ROS; mobil ve bilişsel robotik.'],
 ['Intelligent transportation','Akıllı ulaşım','Intelligent traffic signal control, decision support and fleet management.','Akıllı trafik sinyal kontrolü, karar destek ve filo yönetimi.'],
 ['Methods','Yöntemler','Artificial intelligence and deep learning; control theory, intelligent and nonlinear control; image processing; PLC programming; human–robot interaction (the subject of my PhD thesis).','Yapay zekâ ve derin öğrenme; kontrol teorisi, akıllı ve doğrusal olmayan kontrol; görüntü işleme; PLC programlama; insan–robot etkileşimi (doktora tezimin konusu).']
];
$('interests').innerHTML=INT.map(i=>`<div><dt>${b(i[0],i[1])}</dt><dd>${b(i[2],i[3])}</dd></div>`).join('');

/* ---------- news ----------
   Add items at the top. d: "YYYY-MM" or "YYYY"; en/tr: text; link (optional). */
const NEWS=[
 {d:'2026',en:'Our TÜBİTAK 1001 project on autonomous navigation for underwater vehicles in GNSS-denied environments, led by Prof. Akif Durdu, will be funded for 18 months starting November 2026. It will develop a hybrid navigation software kit that fuses data from onboard sensors using factor graph optimization and deep learning, so that unmanned underwater vehicles can track their position precisely without GPS.',tr:'Prof. Dr. Akif Durdu’nun yürütücülüğünü üstlendiği, GNSS kısıtlı ortamlarda sualtı araçları için otonom seyrüsefer konulu TÜBİTAK 1001 projemiz, Kasım 2026’dan itibaren 18 ay süreyle desteklenecek. Proje kapsamında, araç üzerindeki sensör verilerini faktör grafik optimizasyonu ve derin öğrenme ile birleştiren hibrit bir seyrüsefer yazılım kiti geliştirilecek; böylece insansız sualtı araçları GPS olmadan da konumunu hassas biçimde takip edebilecek.'},
 {d:'2026-03',en:'A TÜBİTAK 1707 project on an IoT-supported two-way communication and digital twin platform for elevators started with Butkon Lift.',tr:'Butkon Lift ile asansörler için IoT destekli çift yönlü iletişim ve dijital ikiz platformu konulu TÜBİTAK 1707 projesi başladı.'},
 {d:'2026-02',en:'New paper in Scientific Reports on disturbance-tolerant quadrotor control with a hybrid LQR and super-twisting sliding mode approach.',tr:'Scientific Reports’ta hibrit LQR ve süper bükülmeli kayan kipli kontrol ile bozucu etkilere dayanıklı quadrotor kontrolü üzerine yeni makale yayımlandı.',link:'https://doi.org/10.1038/s41598-026-38820-0'},
 {d:'2026-01',en:'Joined Link Robotics as technical consultant.',tr:'Link Robotics’te teknik danışman olarak göreve başladım.'},
 {d:'2025-09',en:'Appointed Professor at Konya Technical University.',tr:'Konya Teknik Üniversitesi’nde profesör kadrosuna atandım.'},
 {d:'2025',en:'RACLAB NOVA won the championship and the best team spirit award at the Teknofest Unmanned Underwater Systems Competition.',tr:'RACLAB NOVA, Teknofest İnsansız Su Altı Sistemleri Yarışması’nda şampiyonluk ve en iyi takım ruhu ödülünü kazandı.'},
 {d:'2025',en:'RACLAB SİGUN took second place and the most original software award in the Teknofest Robotaxi ready vehicle category.',tr:'RACLAB SİGUN, Teknofest Robotaksi hazır araç kategorisinde ikincilik ve en özgün yazılım ödülünü aldı.'},
 {d:'2025',en:'RACLAB TULPAR’S placed third in the free category of the Teknofest TÜBİTAK International UAV Competition.',tr:'RACLAB TULPAR’S, Teknofest TÜBİTAK Uluslararası İHA Yarışması serbest kategorisinde üçüncü oldu.'}
];

let pf='all';
function pubItem(p,showYear){
  const au=p[1].replace(/Durdu/g,'<b>Durdu</b>');
  const q=p[5]?`<span class="q ${p[5]==='Q1'?'q1':''}">WoS ${p[5]}</span>`:'';
  const doi=p[4]?` <a href="https://doi.org/${p[4]}" target="_blank" rel="noopener">DOI</a>`:'';
  return row(showYear?p[0]:'',`<p class="pub"><span class="au">${au}</span><span class="ti">${p[2]}</span><span class="vn">${p[3]}${doi}${q}</span></p>`,'');
}
function renderPubs(){
  const list=PUBS.filter(p=>pf==='all'||(pf==='Q34'?(p[5]==='Q3'||p[5]==='Q4'):p[5]===pf));
  let last=0;
  $('pubs').innerHTML=list.map(p=>{const s=p[0]!==last;last=p[0];return pubItem(p,s)}).join('');
  $('pubcount').innerHTML=b(`${list.length} of ${PUBS.length}`,`${PUBS.length} makaleden ${list.length}`);
}

/* ---------- route-planning field (RRT) ---------- */
(function(){
  const cv=$('field'),ctx=cv.getContext('2d');
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  let W,H,dpr,obs,nodes,start,goal,found,path,reveal,raf,step;
  const cssv=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  const rnd=(a,b)=>a+Math.random()*(b-a);
  const dist=(a,b,c,d)=>Math.hypot(a-c,b-d);
  function size(){const r=cv.getBoundingClientRect();dpr=Math.min(window.devicePixelRatio||1,2);W=r.width;H=r.height;cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);step=Math.max(10,Math.min(18,W/45));}
  function hit(a,c){
    for(const o of obs){
      const dx=c.x-a.x,dy=c.y-a.y,l2=dx*dx+dy*dy;
      let t=l2?((o.x-a.x)*dx+(o.y-a.y)*dy)/l2:0;t=Math.max(0,Math.min(1,t));
      if(dist(a.x+t*dx,a.y+t*dy,o.x,o.y)<o.r+3)return true;
    }
    return false;
  }
  function reset(){
    cancelAnimationFrame(raf);size();
    start={x:Math.max(26,W*.04),y:rnd(H*.6,H*.88)};
    goal={x:W-Math.max(26,W*.04),y:rnd(H*.12,H*.4)};
    obs=[];let tries=0;const want=Math.round(W/62);
    while(obs.length<want&&tries<400){
      tries++;const r=rnd(H*.05,H*.13),x=rnd(W*.14,W*.86),y=rnd(H*.06,H*.94);
      if(dist(x,y,start.x,start.y)<r+44||dist(x,y,goal.x,goal.y)<r+44)continue;
      if(obs.some(o=>dist(x,y,o.x,o.y)<o.r+r+16))continue;
      obs.push({x,y,r});
    }
    nodes=[{x:start.x,y:start.y,p:-1}];found=false;path=null;reveal=0;
    if(reduce){let n=0;while(!found&&n<6000){grow(1);n++;}if(!found){return reset();}reveal=1;draw();}
    else loop();
  }
  function grow(k){
    for(let i=0;i<k&&!found;i++){
      const s=Math.random()<.1?goal:{x:rnd(0,W),y:rnd(0,H)};
      let bi=0,bd=1e12;
      for(let j=0;j<nodes.length;j++){const d=(nodes[j].x-s.x)**2+(nodes[j].y-s.y)**2;if(d<bd){bd=d;bi=j}}
      const n=nodes[bi],d=Math.sqrt(bd);if(d<1)continue;
      const t=Math.min(step,d)/d,p={x:n.x+(s.x-n.x)*t,y:n.y+(s.y-n.y)*t,p:bi};
      if(hit(n,p))continue;
      nodes.push(p);
      if(dist(p.x,p.y,goal.x,goal.y)<step*1.2&&!hit(p,goal)){nodes.push({x:goal.x,y:goal.y,p:nodes.length-1});found=true;extract();}
    }
  }
  function extract(){
    const raw=[];let i=nodes.length-1;while(i>=0){raw.push(nodes[i]);i=nodes[i].p;}raw.reverse();
    const sm=[raw[0]];let a=0;
    while(a<raw.length-1){let z=raw.length-1;while(z>a+1&&hit(raw[a],raw[z]))z--;sm.push(raw[z]);a=z;}
    path=sm;
    path.len=0;for(let k=1;k<path.length;k++)path.len+=dist(path[k].x,path[k].y,path[k-1].x,path[k-1].y);
  }
  function draw(){
    const acc=cssv('--acc'),edge=cssv('--edge'),obsC=cssv('--obs'),ink=cssv('--ink');
    ctx.clearRect(0,0,W,H);
    ctx.fillStyle=obsC;ctx.strokeStyle=edge;ctx.lineWidth=1;
    obs.forEach(o=>{ctx.beginPath();ctx.arc(o.x,o.y,o.r,0,7);ctx.fill();ctx.globalAlpha=.5;ctx.stroke();ctx.globalAlpha=1;});
    ctx.strokeStyle=edge;ctx.globalAlpha=found?.55:.9;ctx.beginPath();
    for(let i=1;i<nodes.length;i++){const n=nodes[i],p=nodes[n.p];ctx.moveTo(p.x,p.y);ctx.lineTo(n.x,n.y);}
    ctx.stroke();ctx.globalAlpha=1;
    if(path&&reveal>0){
      ctx.strokeStyle=acc;ctx.lineWidth=2.6;ctx.lineJoin='round';ctx.lineCap='round';
      let left=path.len*reveal;ctx.beginPath();ctx.moveTo(path[0].x,path[0].y);
      for(let k=1;k<path.length;k++){
        const a=path[k-1],c=path[k],seg=dist(a.x,a.y,c.x,c.y);
        if(left>=seg){ctx.lineTo(c.x,c.y);left-=seg;}
        else{const t=left/seg;ctx.lineTo(a.x+(c.x-a.x)*t,a.y+(c.y-a.y)*t);break;}
      }
      ctx.stroke();
    }
    ctx.fillStyle=ink;ctx.beginPath();ctx.arc(start.x,start.y,4.5,0,7);ctx.fill();
    ctx.strokeStyle=ink;ctx.lineWidth=1.6;ctx.beginPath();ctx.arc(goal.x,goal.y,7,0,7);ctx.stroke();
    ctx.fillStyle=ink;ctx.beginPath();ctx.arc(goal.x,goal.y,2.4,0,7);ctx.fill();
  }
  function loop(){
    if(!found){grow(4);if(nodes.length>3500){return reset();}}
    else if(reveal<1){reveal=Math.min(1,reveal+.018);}
    draw();
    if(!found||reveal<1)raf=requestAnimationFrame(loop);
  }
  let rt;window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(reset,200)});
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{if(nodes)draw()});
  cv.addEventListener('click',reset);$('replan').addEventListener('click',reset);
  reset();
})();
</script>
